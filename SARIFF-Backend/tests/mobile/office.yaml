# Ugandan bureau office user on Android: sign in with SMS code, open every tab.
appId: com.sariff.mobile
name: Office user (Ugandan bureau)
---
- launchApp:
    clearState: true
- runFlow: dismiss.yaml
- extendedWaitUntil:
    visible: "Enter your credentials to continue"
    timeout: 120000
- takeScreenshot: 01-login
- tapOn: "e.g. AFB-2026-0001"
- inputText: ${UG_CODE}
- hideKeyboard
- tapOn: "e.g. +254711111111"
- inputText: ${UG_PHONE}
- hideKeyboard
- scrollUntilVisible:
    element: "Enter password"
    direction: DOWN
- tapOn: "Enter password"
- inputText: ${UG_PASS}
- hideKeyboard
- tapOn:
    text: "Sign In"
    index: 1
- extendedWaitUntil:
    visible: "Verify OTP"
    timeout: 30000
- runScript:
    file: otp.js
    env:
      PHONE: ${UG_PHONE}
- inputText: ${output.d[0]}
- inputText: ${output.d[1]}
- inputText: ${output.d[2]}
- inputText: ${output.d[3]}
- inputText: ${output.d[4]}
- inputText: ${output.d[5]}
- runFlow:
    when:
      visible: "Verify Code"
    commands:
      - tapOn: "Verify Code"
- extendedWaitUntil:
    visible: "Welcome back,"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: 02-office-dashboard
- runFlow: broken.yaml
- assertVisible: ".*UGX.*"
- assertVisible: "Ugandan Shilling.*"
# bottom tab "Clients" (tabs are not exposed by name to the test driver)
- tapOn:
    point: "30%,96%"
- extendedWaitUntil:
    visible: ".*Test Amina.*"
    timeout: 20000
- takeScreenshot: 03-office-clients
- runFlow: broken.yaml
# bottom tab "Exchange" (tabs are not exposed by name to the test driver)
- tapOn:
    point: "50%,96%"
- waitForAnimationToEnd
- takeScreenshot: 04-office-exchange
- runFlow: broken.yaml
# bottom tab "Transactions" (tabs are not exposed by name to the test driver)
- tapOn:
    point: "70%,96%"
- waitForAnimationToEnd
- takeScreenshot: 05-office-transactions
- runFlow: broken.yaml
# bottom tab "More" (tabs are not exposed by name to the test driver)
- tapOn:
    point: "90%,96%"
- waitForAnimationToEnd
- takeScreenshot: 06-office-more
- runFlow: broken.yaml
